baseURL = 'https://rue-asha.github.io/'
title = 'Rue Asha'

locale = 'en-us'
defaultContentLanguage = 'en'
hasCJKLanguage = false

enableGitInfo = true
enableRobotsTXT = true
enableInlineShortcodes = true

# No taxonomies. Sections say what kind of page it is, folders say which platform,
# and full-text search covers "everything mentioning X" without a hand-kept vocabulary.
# Hugo defaults to tags + categories, so this must be disabled explicitly rather than
# just omitted. Must stay above the first [table] header — a bare key after one would
# be parsed as belonging to that table.
disableKinds = ['taxonomy', 'term']

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # allow raw HTML in Markdown (needed for some Hextra shortcodes)
  [markup.goldmark.extensions.passthrough]
    enable = true          # keep $...$ / $$...$$ intact for KaTeX
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)']]
  [markup.highlight]
    noClasses = false      # required so the theme's light/dark syntax themes work
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# ---------------------------------------------------------------- navigation
[menu]
  [[menu.main]]
    name = 'Writeups'
    pageRef = '/writeups'
    weight = 1
  [[menu.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 2
  [[menu.main]]
    name = 'Journal'
    pageRef = '/blog'
    weight = 3
  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 4
  [[menu.main]]
    name = 'Search'
    weight = 5
    [menu.main.params]
      type = 'search'
  [[menu.main]]
    name = 'GitHub'
    url = 'https://github.com/Rue-Asha'
    weight = 6
    [menu.main.params]
      icon = 'github'

# ------------------------------------------------------------------- params
[params]
  description = 'Cybersecurity writeups, project documentation and learning notes by Rue Asha.'

  [params.author]
    name = 'Rue Asha'
    email = 'rue.asha@proton.me'

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = true

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.search]
    enable = true
    type = 'flexsearch'

  [params.editURL]
    enable = true
    base = 'https://github.com/Rue-Asha/Rue-Asha.github.io/edit/main/content'

  [params.blog]
    [params.blog.list]
      displayTags = false
      sortBy = 'date'
      sortOrder = 'desc'
    [params.blog.article]
      displayPagination = true

  [params.highlight.copy]
    enable = true
    display = 'hover'

  displayUpdatedDate = true
  dateFormat = 'January 2, 2006'
  enableImageLazyLoading = true
  externalLinkDecoration = true

  [params.imageZoom]
    enable = true

  [params.comments]
    enable = false
    type = 'giscus'
    # Fill these in after enabling giscus.app on the repo, then set enable = true.
    [params.comments.giscus]
      repo = 'Rue-Asha/Rue-Asha.github.io'
      repoId = ''
      category = 'Comments'
      categoryId = ''
      mapping = 'pathname'
      strict = '0'
      reactionsEnabled = '1'
      emitMetadata = '0'
      inputPosition = 'top'
      lang = 'en'

# ------------------------------------------------------------------ modules
[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'
